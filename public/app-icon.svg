<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Rich Tech Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glassmorphic Specular Sheen -->
    <radialGradient id="specularGlow" cx="25%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Inner Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow for Monogram -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>

    <!-- Cyan Accent Glow -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Base (Standard iOS / Android curve) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Subtle Specular Lighting -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#specularGlow)" />

  <!-- Inner Stroke Highlight -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" ry="106.5" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Monogram Graphic -->
  <g filter="url(#monogramShadow)">
    <text 
      x="234" 
      y="326" 
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="208" 
      font-weight="900" 
      fill="#FFFFFF" 
      text-anchor="middle" 
      letter-spacing="-8"
    >
      NS
    </text>
  </g>

  <!-- Live Pulse Tech Indicator / Accent Dot -->
  <g filter="url(#cyanGlow)">
    <circle cx="388" cy="192" r="20" fill="#38BDF8" />
    <circle cx="388" cy="192" r="12" fill="#E0F2FE" />
  </g>
</svg>
