<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />
  <!-- Gloss overlay border -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#innerGlow)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- App Monogram / Identity -->
  <g filter="url(#dropShadow)">
    <!-- "NS" Emblem -->
    <text x="256" y="295" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">
      NS
    </text>
    <text x="256" y="375" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#E0E7FF" text-anchor="middle" letter-spacing="8">
      DEVELOPER
    </text>
  </g>

  <!-- Accent dot -->
  <circle cx="390" cy="220" r="16" fill="#38BDF8" />
</svg>
